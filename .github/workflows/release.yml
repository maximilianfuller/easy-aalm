name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Download Wine Crossover
        run: |
          curl -L -o wine-crossover.tar.xz "https://github.com/Gcenx/winecx/releases/download/crossover-wine-23.7.1-1/wine-crossover-23.7.1-1-osx64.tar.xz"
          mkdir -p bundled_wine
          tar -xf wine-crossover.tar.xz -C bundled_wine
          rm wine-crossover.tar.xz

      - name: Build with PyInstaller
        run: |
          pyinstaller easy_aalm.spec --clean --noconfirm

      - name: Create bundled Python venv
        run: |
          BUNDLE_VENV="dist/Easy AALM.app/Contents/Resources/venv"
          python -m venv "$BUNDLE_VENV"
          "$BUNDLE_VENV/bin/pip" install streamlit pandas plotly openpyxl

          # Make Python fully portable by copying the binary and its dependencies
          echo "Making Python portable..."
          PYTHON_REAL=$(python3 -c "import sys, os; print(os.path.realpath(sys.executable))")
          PYTHON_FRAMEWORK=$(dirname "$(dirname "$PYTHON_REAL")")

          echo "  Python binary: $PYTHON_REAL"
          echo "  Framework: $PYTHON_FRAMEWORK"
          echo "  Framework contents:"
          ls -la "$PYTHON_FRAMEWORK/" || true

          # Copy the actual Python binary (replacing symlink)
          rm -f "$BUNDLE_VENV/bin/python3"
          cp "$PYTHON_REAL" "$BUNDLE_VENV/bin/python3"

          # Check what libraries the binary needs
          echo "  Binary dependencies:"
          otool -L "$BUNDLE_VENV/bin/python3" | head -5

          # Copy the Python3 dylib - check multiple possible locations
          if [ -f "$PYTHON_FRAMEWORK/Python3" ]; then
              echo "  Copying Python3 dylib from framework..."
              cp "$PYTHON_FRAMEWORK/Python3" "$BUNDLE_VENV/"
          elif [ -f "$PYTHON_FRAMEWORK/lib/libpython3.11.dylib" ]; then
              echo "  Copying libpython3.11.dylib..."
              cp "$PYTHON_FRAMEWORK/lib/libpython3.11.dylib" "$BUNDLE_VENV/Python3"
          elif [ -f "/usr/local/Frameworks/Python.framework/Versions/3.11/Python" ]; then
              echo "  Copying from Python.framework..."
              cp "/usr/local/Frameworks/Python.framework/Versions/3.11/Python" "$BUNDLE_VENV/Python3"
          fi

          # Copy the Resources folder (contains Python.app needed by macOS Python)
          if [ -d "$PYTHON_FRAMEWORK/Resources" ]; then
              echo "  Copying Resources..."
              cp -R "$PYTHON_FRAMEWORK/Resources" "$BUNDLE_VENV/"
          fi

          # Update pyvenv.cfg to not reference external paths
          echo "home = bin" > "$BUNDLE_VENV/pyvenv.cfg"
          echo "include-system-site-packages = false" >> "$BUNDLE_VENV/pyvenv.cfg"

          # Create relative symlinks
          cd "$BUNDLE_VENV/bin"
          rm -f python python3.11 2>/dev/null || true
          ln -s python3 python
          ln -s python3 python3.11

          # Verify the bundled Python works
          cd -
          echo "  Testing bundled Python..."
          "$BUNDLE_VENV/bin/python3" -c "import sys; print('Python OK:', sys.version)" || echo "WARNING: Bundled Python test failed"
          "$BUNDLE_VENV/bin/python3" -c "import streamlit; print('Streamlit OK')" || echo "WARNING: Streamlit import failed"

      - name: Bundle Wine
        run: |
          cp -R "bundled_wine/Wine Crossover.app" "dist/Easy AALM.app/Contents/Resources/"

      - name: Import Code Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Clean up
          rm certificate.p12

      - name: Sign and Notarize App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd "dist"

          # Find signing identity
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -n 's/.*"\(.*\)"/\1/p')
          echo "Using signing identity: $SIGNING_IDENTITY"

          # Remove extended attributes
          xattr -cr "Easy AALM.app"

          # Sign Wine binaries with special entitlements (Wine needs JIT)
          echo "Signing Wine binaries with entitlements..."
          find "Easy AALM.app/Contents/Resources/Wine Crossover.app" -type f | while read file; do
            if file "$file" | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp --entitlements ../wine-entitlements.plist --sign "$SIGNING_IDENTITY" "$file" 2>/dev/null || true
            fi
          done

          # Sign Wine bundle with entitlements
          echo "Signing Wine Crossover.app..."
          codesign --force --deep --options runtime --timestamp --entitlements ../wine-entitlements.plist --sign "$SIGNING_IDENTITY" "Easy AALM.app/Contents/Resources/Wine Crossover.app" || true

          # Sign other Mach-O binaries (venv, frameworks) without Wine entitlements
          echo "Signing other binaries..."
          find "Easy AALM.app" -type f -not -path "*/Wine Crossover.app/*" | while read file; do
            if file "$file" | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$file" 2>/dev/null || true
            fi
          done

          # Sign the main app with hardened runtime and timestamp
          echo "Signing Easy AALM.app..."
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" "Easy AALM.app"

          # Create zip for notarization
          ditto -c -k --keepParent "Easy AALM.app" "Easy-AALM.zip"

          # Submit for notarization
          SUBMISSION_OUTPUT=$(xcrun notarytool submit "Easy-AALM.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1) || true

          echo "$SUBMISSION_OUTPUT"

          # Extract submission ID and check for failure
          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')

          if echo "$SUBMISSION_OUTPUT" | grep -q "Invalid"; then
            echo "Notarization failed. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APP_PASSWORD" \
              --team-id "$TEAM_ID"
            exit 1
          fi

          # Staple the ticket
          xcrun stapler staple "Easy AALM.app"

          # Clean up zip
          rm "Easy-AALM.zip"

      - name: Create DMG
        run: |
          hdiutil create -volname "Easy AALM" -srcfolder "dist/Easy AALM.app" -ov -format UDZO "Easy-AALM-macOS.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy-AALM-macOS
          path: Easy-AALM-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pythonnet

      - name: Build with PyInstaller
        run: |
          pyinstaller easy_aalm_windows.spec --clean --noconfirm

      - name: Bundle pythonnet runtime
        run: |
          # Copy clr_loader and pythonnet files
          $clrPath = python -c "import clr_loader; import os; print(os.path.dirname(clr_loader.__file__))"
          Copy-Item -Path "$clrPath" -Destination "dist\EasyAALM\clr_loader" -Recurse -Force

          # Copy pythonnet
          $pynetPath = python -c "import pythonnet; import os; print(os.path.dirname(pythonnet.__file__))"
          Copy-Item -Path "$pynetPath" -Destination "dist\EasyAALM\pythonnet" -Recurse -Force

      - name: Create bundled Python venv
        run: |
          python -m venv "dist\EasyAALM\venv"
          dist\EasyAALM\venv\Scripts\pip install streamlit pandas plotly openpyxl

      - name: Create Installer with Inno Setup
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy-AALM-Windows
          path: Easy-AALM-Windows-Setup.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Easy-AALM-macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Easy-AALM-Windows

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Easy AALM ${{ steps.version.outputs.version }}
          body: |
            ## Easy AALM - Lead Exposure Calculator

            A desktop application for running EPA's All-Ages Lead Model (AALM).

            ### Downloads
            - **macOS**: `Easy-AALM-macOS.dmg` - Double-click to open, drag to Applications
            - **Windows**: `Easy-AALM-Windows-Setup.exe` - Run installer, then launch from Start Menu or Desktop

            ### What's Included
            - Bundled Python environment with Streamlit
            - AALM model executables
            - Wine (macOS only, for running Windows AALM executable)
          files: |
            Easy-AALM-macOS.dmg
            Easy-AALM-Windows-Setup.exe
          draft: false
          prerelease: false
