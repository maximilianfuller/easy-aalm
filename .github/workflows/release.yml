name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-macos:
    runs-on: macos-14  # Use ARM64 (M1) runner for native Apple Silicon build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Download Wine Crossover
        run: |
          curl -L -o wine-crossover.tar.xz "https://github.com/Gcenx/winecx/releases/download/crossover-wine-23.7.1-1/wine-crossover-23.7.1-1-osx64.tar.xz"
          mkdir -p bundled_wine
          tar -xf wine-crossover.tar.xz -C bundled_wine
          rm wine-crossover.tar.xz

      - name: Build with PyInstaller
        run: |
          pyinstaller easy_aalm.spec --clean --noconfirm

      - name: Download standalone Python
        run: |
          echo "Runner architecture: $(uname -m)"

          # Download ARM64 Python for Apple Silicon (native on M1/M2, runner is ARM64)
          echo "Downloading ARM64 Python..."
          curl -L -o python-arm64.tar.gz "https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-aarch64-apple-darwin-install_only.tar.gz"
          mkdir python-arm64
          tar -xzf python-arm64.tar.gz -C python-arm64 --strip-components=1
          rm python-arm64.tar.gz

          # Verify Python works
          echo "Testing ARM64 Python..."
          python-arm64/bin/python3 --version
          python-arm64/bin/python3 -c "import sys; print(f'Platform: {sys.platform}')"

      - name: Create bundled Python venv
        run: |
          BUNDLE_VENV="dist/Easy AALM.app/Contents/Resources/venv"

          # Create the venv directory structure
          echo "Creating venv directory..."
          mkdir -p "$BUNDLE_VENV"

          # Check what we have from standalone Python
          echo "Standalone Python contents:"
          ls -la python-arm64/

          # Copy the standalone Python (ARM64 for native Apple Silicon performance)
          echo "Copying standalone Python..."
          cp -R python-arm64/* "$BUNDLE_VENV/"

          # Create symlink from python to python3 if needed
          if [ ! -f "$BUNDLE_VENV/bin/python" ] && [ -f "$BUNDLE_VENV/bin/python3" ]; then
            ln -sf python3 "$BUNDLE_VENV/bin/python"
          fi

          # Show what we have after copy
          echo "Bundle venv contents:"
          ls -la "$BUNDLE_VENV/"
          echo "Bundle venv/bin contents:"
          ls -la "$BUNDLE_VENV/bin/"

          # Test the bundled Python before installing packages
          echo "Testing bundled Python..."
          "$BUNDLE_VENV/bin/python3" --version

          # Install packages
          echo "Installing packages..."
          "$BUNDLE_VENV/bin/python3" -m pip install --upgrade pip
          "$BUNDLE_VENV/bin/python3" -m pip install streamlit pandas plotly openpyxl

          # Test that streamlit imports
          echo "Verifying streamlit..."
          "$BUNDLE_VENV/bin/python3" -c "import streamlit; print('Streamlit OK')"

      - name: Bundle Wine
        run: |
          cp -R "bundled_wine/Wine Crossover.app" "dist/Easy AALM.app/Contents/Resources/"

      - name: Import Code Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Clean up
          rm certificate.p12

      - name: Sign and Notarize App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd "dist"

          # Find signing identity
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -n 's/.*"\(.*\)"/\1/p')
          echo "Using signing identity: $SIGNING_IDENTITY"

          # Remove extended attributes
          xattr -cr "Easy AALM.app"

          # Sign Wine binaries with special entitlements (Wine needs JIT)
          echo "Signing Wine binaries with entitlements..."
          find "Easy AALM.app/Contents/Resources/Wine Crossover.app" -type f | while read file; do
            if file "$file" | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp --entitlements ../wine-entitlements.plist --sign "$SIGNING_IDENTITY" "$file" 2>/dev/null || true
            fi
          done

          # Sign Wine bundle with entitlements
          echo "Signing Wine Crossover.app..."
          codesign --force --deep --options runtime --timestamp --entitlements ../wine-entitlements.plist --sign "$SIGNING_IDENTITY" "Easy AALM.app/Contents/Resources/Wine Crossover.app" || true

          # Sign other Mach-O binaries (venv, frameworks) without Wine entitlements
          echo "Signing other binaries..."
          find "Easy AALM.app" -type f -not -path "*/Wine Crossover.app/*" | while read file; do
            if file "$file" | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$file" 2>/dev/null || true
            fi
          done

          # Sign the main app with hardened runtime and timestamp
          echo "Signing Easy AALM.app..."
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" "Easy AALM.app"

          # Create zip for notarization
          ditto -c -k --keepParent "Easy AALM.app" "Easy-AALM.zip"

          # Submit for notarization
          SUBMISSION_OUTPUT=$(xcrun notarytool submit "Easy-AALM.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1) || true

          echo "$SUBMISSION_OUTPUT"

          # Extract submission ID and check for failure
          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')

          if echo "$SUBMISSION_OUTPUT" | grep -q "Invalid"; then
            echo "Notarization failed. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APP_PASSWORD" \
              --team-id "$TEAM_ID"
            exit 1
          fi

          # Staple the ticket
          xcrun stapler staple "Easy AALM.app"

          # Clean up zip
          rm "Easy-AALM.zip"

      - name: Create DMG with Applications shortcut
        run: |
          # Create a temporary folder for DMG contents
          mkdir -p dmg_contents
          cp -R "dist/Easy AALM.app" dmg_contents/

          # Create symlink to Applications folder
          ln -s /Applications dmg_contents/Applications

          # Create DMG with the app and Applications symlink
          hdiutil create -volname "Easy AALM" -srcfolder dmg_contents -ov -format UDZO "Easy-AALM-macOS.dmg"

          # Clean up
          rm -rf dmg_contents

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy-AALM-macOS
          path: Easy-AALM-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pythonnet

      - name: Build with PyInstaller
        run: |
          pyinstaller easy_aalm_windows.spec --clean --noconfirm

      - name: Bundle pythonnet runtime
        run: |
          # Copy clr_loader and pythonnet files
          $clrPath = python -c "import clr_loader; import os; print(os.path.dirname(clr_loader.__file__))"
          Copy-Item -Path "$clrPath" -Destination "dist\EasyAALM\clr_loader" -Recurse -Force

          # Copy pythonnet
          $pynetPath = python -c "import pythonnet; import os; print(os.path.dirname(pythonnet.__file__))"
          Copy-Item -Path "$pynetPath" -Destination "dist\EasyAALM\pythonnet" -Recurse -Force

      - name: Download standalone Python for Windows
        run: |
          # Download standalone Python (same approach as macOS)
          Invoke-WebRequest -Uri "https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-pc-windows-msvc-install_only.tar.gz" -OutFile "python-standalone.tar.gz"
          mkdir python-standalone
          tar -xzf python-standalone.tar.gz -C python-standalone
          Remove-Item python-standalone.tar.gz

          # Debug: show directory structure
          Write-Host "Standalone Python contents:"
          Get-ChildItem -Path python-standalone -Recurse -Depth 2 | Select-Object FullName

      - name: Create bundled Python venv
        run: |
          # The archive extracts to python-standalone/python/ on Windows
          $pythonSrc = "python-standalone\python"
          if (-not (Test-Path $pythonSrc)) {
            # Fallback: check if it's directly in python-standalone
            $pythonSrc = "python-standalone"
          }
          Write-Host "Using Python from: $pythonSrc"

          # Create venv directory and copy standalone Python
          New-Item -ItemType Directory -Force -Path "dist\EasyAALM\venv"
          Copy-Item -Path "$pythonSrc\*" -Destination "dist\EasyAALM\venv" -Recurse -Force

          # Debug: show what we copied
          Write-Host "Venv contents:"
          Get-ChildItem -Path "dist\EasyAALM\venv" -Depth 1

          # Install packages using the standalone Python
          dist\EasyAALM\venv\python.exe -m pip install --upgrade pip
          dist\EasyAALM\venv\python.exe -m pip install streamlit pandas plotly openpyxl

          # Verify it works
          dist\EasyAALM\venv\python.exe -c "import streamlit; print('Streamlit OK')"

      - name: Create Installer with Inno Setup
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy-AALM-Windows
          path: Easy-AALM-Windows-Setup.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Easy-AALM-macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Easy-AALM-Windows

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Easy AALM ${{ steps.version.outputs.version }}
          body: |
            ## Easy AALM - Lead Exposure Calculator

            A desktop application for running EPA's All-Ages Lead Model (AALM).

            ### Downloads
            - **macOS**: `Easy-AALM-macOS.dmg` - Double-click to open, drag to Applications
            - **Windows**: `Easy-AALM-Windows-Setup.exe` - Run installer, then launch from Start Menu or Desktop

            ### What's Included
            - Bundled Python environment with Streamlit
            - AALM model executables
            - Wine (macOS only, for running Windows AALM executable)
          files: |
            Easy-AALM-macOS.dmg
            Easy-AALM-Windows-Setup.exe
          draft: false
          prerelease: false
