name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Download Wine Crossover
        run: |
          curl -L -o wine-crossover.tar.xz "https://github.com/Gcenx/winecx/releases/download/crossover-wine-23.7.1-1/wine-crossover-23.7.1-1-osx64.tar.xz"
          mkdir -p bundled_wine
          tar -xf wine-crossover.tar.xz -C bundled_wine
          rm wine-crossover.tar.xz

      - name: Build with PyInstaller
        run: |
          pyinstaller easy_aalm.spec --clean --noconfirm

      - name: Create bundled Python venv
        run: |
          python -m venv "dist/Easy AALM.app/Contents/Resources/venv"
          "dist/Easy AALM.app/Contents/Resources/venv/bin/pip" install streamlit pandas plotly openpyxl

      - name: Bundle Wine
        run: |
          cp -R "bundled_wine/Wine Crossover.app" "dist/Easy AALM.app/Contents/Resources/"

      - name: Import Code Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Clean up
          rm certificate.p12

      - name: Sign and Notarize App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd "dist"

          # Find signing identity
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -n 's/.*"\(.*\)"/\1/p')
          echo "Using signing identity: $SIGNING_IDENTITY"

          # Remove extended attributes
          xattr -cr "Easy AALM.app"

          # Sign the app
          codesign --deep --force --verify --verbose --sign "$SIGNING_IDENTITY" "Easy AALM.app"

          # Create zip for notarization
          ditto -c -k --keepParent "Easy AALM.app" "Easy-AALM.zip"

          # Submit for notarization
          xcrun notarytool submit "Easy-AALM.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          # Staple the ticket
          xcrun stapler staple "Easy AALM.app"

          # Clean up zip
          rm "Easy-AALM.zip"

      - name: Create DMG
        run: |
          hdiutil create -volname "Easy AALM" -srcfolder "dist/Easy AALM.app" -ov -format UDZO "Easy-AALM-macOS.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy-AALM-macOS
          path: Easy-AALM-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Build with PyInstaller
        run: |
          pyinstaller easy_aalm_windows.spec --clean --noconfirm

      - name: Create bundled Python venv
        run: |
          python -m venv "dist\EasyAALM\venv"
          dist\EasyAALM\venv\Scripts\pip install streamlit pandas plotly openpyxl

      - name: Create ZIP
        run: |
          Compress-Archive -Path "dist\EasyAALM" -DestinationPath "Easy-AALM-Windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy-AALM-Windows
          path: Easy-AALM-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Easy-AALM-macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Easy-AALM-Windows

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Easy AALM ${{ steps.version.outputs.version }}
          body: |
            ## Easy AALM - Lead Exposure Calculator

            A desktop application for running EPA's All-Ages Lead Model (AALM).

            ### Downloads
            - **macOS**: `Easy-AALM-macOS.dmg` - Double-click to open, drag to Applications
            - **Windows**: `Easy-AALM-Windows.zip` - Extract and run `Easy AALM.exe`

            ### What's Included
            - Bundled Python environment with Streamlit
            - AALM model executables
            - Wine (macOS only, for running Windows AALM executable)
          files: |
            Easy-AALM-macOS.dmg
            Easy-AALM-Windows.zip
          draft: false
          prerelease: false
